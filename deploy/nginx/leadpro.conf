# nginx site for LeadFinder Pro.
#   cp deploy/nginx/leadpro.conf /etc/nginx/sites-available/leadpro
#   edit server_name, root and the API port below, then:
#   ln -s /etc/nginx/sites-available/leadpro /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   certbot --nginx -d your-domain.com        # adds HTTPS to this file
#
# The frontend is the static build in frontend/dist/client. /api is forwarded to the backend,
# which only listens on 127.0.0.1 (pm2). The browser only ever talks to this one domain.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/LeadPro/frontend/dist/client;

    # Lead imports (CSV / Excel) upload up to ~30 MB.
    client_max_body_size 30m;

    location /api/ {
        # Must match PORT in backend/.env.
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Big imports and exports can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Built files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every page is the same app shell; the app picks the page from the URL.
    # Security headers for the app's pages (the API sets its own).
    location / {
        try_files $uri /_shell.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
